    <!-- Contact Us Section -->
<section id="contact" style="padding: 50px; background-color: #f9f9f9;">
  <h2 style="text-align: center; font-family: Arial, sans-serif;">Contact Us</h2>
  <p style="text-align: center; max-width: 600px; margin: 10px auto; font-family: Arial, sans-serif;">
    We'd love to hear from you! Fill out the form below or reach us via email, phone, or social media.
  </p>

  <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 50px; margin-top: 30px;">

    <!-- Contact Form -->
    <form style="flex: 1 1 350px; max-width: 400px;" action="#" method="post">
      <input type="text" name="name" placeholder="Your Name" required
             style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc;">
      <input type="email" name="email" placeholder="Your Email" required
             style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc;">
      <input type="text" name="subject" placeholder="Subject"
             style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc;">
      <textarea name="message" rows="5" placeholder="Your Message" required
                style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc;"></textarea>
      <button type="submit"
              style="padding: 10px 20px; border: none; border-radius: 5px; background-color: #007BFF; color: white; cursor: pointer;">
        Send Message
      </button>
    </form>

    <!-- Contact Info -->
    <div style="flex: 1 1 300px; max-width: 350px; font-family: Arial, sans-serif;">
      <h3>Contact Info</h3>
      <p>Email: <a href="mailto:contact@yourwebsite.com">contact@yourwebsite.com</a></p>
      <p>Phone: <a href="tel:+237653863161">+237 653 86 31 61</a></p>
      <p>Address: 123 Main Street, Your City, Your Country</p>

      <h3>Follow Us</h3>
      <div style="display: flex; gap: 15px; font-size: 24px;">
        <a href="#" target="_blank">🌐</a>
        <a href="#" target="_blank"><img src="../images/Tiktok.png" alt="Blackgoose" width="30" height="30"></a>
        <a href="#" target="_blank"><img src="../images/Facebook.png" alt="Blackgoose" width="30" height="30"></a>
        <a href="#" target="_blank"><img src="../images/instagram.png" alt="Blackgoose" width="30" height="30"></a>
        <a href="#" target="_blank"><img src="../images/Youtube.png" alt="Blackgoose" width="30" height="30"></a>
      </div>

      <h3 style="margin-top: 20px;">Find Us</h3>
      <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.086245207555!2d-122.41941548468104!3d37.774929279758265!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085818c8bfb77bb%3A0x6db1a5bbf2c4f5b6!2sSan+Francisco%2C+CA%2C+USA!5e0!3m2!1sen!2s!4v1600000000000!5m2!1sen!2s"
        width="100%" height="200" style="border:0; border-radius: 5px;" allowfullscreen="" loading="lazy"></iframe>
    </div>
